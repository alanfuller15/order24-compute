name: a9final_check
# Collects the 8 parts of the A9 final claim (exp artifacts a9v3_final_p0..p7, from exp/a9final.sh) without anyone watching.
# Writes A9_FINAL.md to the one-commit branch a9-final-status: per part, the VERDICT line, the input digest and code.sha256,
# and an overall line. "ALL 8 PARTS AGREE" is a mechanical check of the job outputs only: the final claim still needs an
# independent review (a reviewer that did not produce it) before it is stated anywhere.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: a9final_check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: Collect parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e; R=${{ github.repository }}; O=$RUNNER_TEMP/a9; mkdir -p $O; S=$RUNNER_TEMP/A9_FINAL.md
          echo "# A9 final claim: mechanical collection ($(date -u +%Y-%m-%dT%H:%MZ))" > $S; echo >> $S
          ok=0; D=""; C=""; same=1
          for k in 0 1 2 3 4 5 6 7; do
            n=a9v3_final_p$k
            id=$(gh api "repos/$R/actions/artifacts?name=$n&per_page=1" -q '.artifacts[0].workflow_run.id // empty')
            if [ -z "$id" ]; then echo "- part $k: no artifact yet" >> $S; continue; fi
            st=$(gh api repos/$R/actions/runs/$id -q '.status+" "+(.conclusion//"")')
            mkdir -p $O/$k; gh run download $id -R $R -n $n -D $O/$k >/dev/null 2>&1
            v=$(grep -rh "A9 FINAL VERDICT" $O/$k 2>/dev/null | tail -1)
            c=$(cat $O/$k/code.sha256 2>/dev/null | sha256sum | cut -c1-16)
            d=$(echo "$v" | grep -o 'input digest [0-9a-f]*' | awk '{print $3}')
            gf=$( [ -e $O/$k/GATE_FAIL ] && echo " GATE_FAIL" )
            echo "- part $k: run $id ($st)$gf; code $c; ${v:-no verdict line}" >> $S
            if echo "$v" | grep -q "COVERED AND VERIFIED" && [ -z "$gf" ]; then ok=$((ok+1)); fi
            [ -z "$D" ] && D=$d; [ -z "$C" ] && C=$c
            { [ -n "$d" ] && [ "$d" != "$D" ]; } && same=0; [ "$c" != "$C" ] && same=0
          done
          echo >> $S
          if [ $ok -eq 8 ] && [ $same -eq 1 ]; then echo "**ALL 8 PARTS AGREE: COVERED AND VERIFIED, one input digest ($D), one code digest ($C).** Needs independent review before it is claimed." >> $S
          else echo "**Not complete:** $ok/8 parts COVERED AND VERIFIED; digests consistent: $same." >> $S; fi
          cat $S >> "$GITHUB_STEP_SUMMARY"
          T=$(printf '100644 blob %s\tA9_FINAL.md\n' "$(git hash-object -w $S)" | git mktree)
          M=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$T" -m "a9 final status $(date -u +%Y-%m-%dT%H:%MZ)")
          git push -q -f origin "$M:refs/heads/a9-final-status" && echo pushed
