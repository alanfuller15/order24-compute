name: exp
# Research experiments only (exp/*.py, exp/*.sh). Nothing here produces records or proofs that count; outputs are uploaded for reading.
on:
  workflow_dispatch:
    inputs:
      script: {description: 'script in exp/ (e.g. sym_ab.py)', required: true}
      args:   {description: 'arguments passed to the script', required: false, default: ''}
      name:   {description: 'artifact name', required: true}
      minutes: {description: 'job time limit in minutes (max 350)', required: false, default: '300'}
      run_id:   {description: 'optional: producer run id; passed as RUN_ID (with GH_TOKEN, actions:read) to download ARTIFACT', required: false, default: ''}
      artifact: {description: 'optional: producer artifact name, passed as ARTIFACT', required: false, default: ''}
      tag:      {description: 'optional: record tag, passed as TAG', required: false, default: ''}
permissions:
  contents: read
  actions: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          sha256sum -c SHA256SUMS
          chmod +x bin/*
          sudo pip3 install --break-system-packages -q "python-sat==1.9.dev21" numpy networkx
          nproc; free -g
      - name: Run
        env:
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
          MIN: ${{ inputs.minutes }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT: ${{ inputs.artifact }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p exp_out
          case "$SCRIPT" in *[!A-Za-z0-9_.-]*) echo "bad script name"; exit 1;; esac
          case "$SCRIPT" in
            *.sh) timeout --signal=INT $(( MIN * 60 )) bash "exp/$SCRIPT" $ARGS 2>&1 | tee exp_out/log.txt || true;;
            *)    timeout --signal=INT $(( MIN * 60 )) python3 -I -B "exp/$SCRIPT" $ARGS 2>&1 | tee exp_out/log.txt || true;;
          esac
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: exp_out/
          retention-days: 14
      - name: Gate
        if: always()
        run: |
          # fails the job (after the upload) when a script reported a failure or any MODEL_FOUND.json exists
          if [ -e exp_out/GATE_FAIL ]; then echo "GATE_FAIL: $(cat exp_out/GATE_FAIL)"; exit 1; fi
          if [ -n "$(find exp_out in -name MODEL_FOUND.json 2>/dev/null)" ]; then echo "MODEL_FOUND.json present"; exit 1; fi
