name: produce
on:
  workflow_dispatch:
    inputs:
      wave:   {description: 'wave name (chunks/<wave>/*.txt)', required: true}
      mode:   {description: 'grun, ccc or merge (join CUBE_SHARD states, then stitch)', required: true, default: grun}
      chunks: {description: 'JSON list of chunk names, e.g. ["c01","c02"]', required: true}
      formulas: {description: 'formulas file in data/', required: false, default: formulas89_c66.json}
      grun:     {description: 'producer script in code/ (grun90.py = encoder v7, grun90v8.py = encoder v8)', required: false, default: grun90.py}
      par:      {description: 'max concurrent jobs of this run', required: false, default: '20'}
      prev_run: {description: 'ccc chaining: run id whose artifacts <prev_wave>-<chunk> hold the cube state to resume', required: false, default: ''}
      prev_wave: {description: 'ccc chaining: wave name of prev_run (default: this wave)', required: false, default: ''}
      cube_depth: {description: 'ccc: initial cube depth (CUBE_DEPTH)', required: false, default: '4'}
      tune: {description: 'ccc tuning "EXT_TIMEOUT,PYSAT_CAP" in seconds (default 1500,240)', required: false, default: '1500,240'}
permissions:
  contents: read
  actions: read
jobs:
  work:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.par) }}
      matrix:
        chunk: ${{ fromJSON(inputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          sha256sum -c SHA256SUMS
          chmod +x bin/* worker.sh
          python3 --version
          sudo pip3 install --break-system-packages -q "python-sat==1.9.dev21" numpy networkx
          python3 -I -c "import pysat, numpy, networkx; print(pysat.__version__)"
          nproc; free -g
      - name: Restore previous ccc state
        if: ${{ inputs.prev_run != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHUNK: ${{ matrix.chunk }}
          PW: ${{ inputs.prev_wave != '' && inputs.prev_wave || inputs.wave }}
          PR: ${{ inputs.prev_run }}
          MODE: ${{ inputs.mode }}
          REPO: ${{ github.repository }}
        run: |
          B=${CHUNK%%k[0-9]*}
          if [ "$MODE" = merge ]; then
            for a in $(gh api "repos/$REPO/actions/runs/$PR/artifacts?per_page=100" --jq '.artifacts[].name' | grep -E "^$PW-${B}k[0-9]+of[0-9]+$"); do
              gh run download "$PR" -R "$REPO" -n "$a" -D "shards/$a"; done
            ls shards
          else
            gh run download "$PR" -R "$REPO" -n "$PW-$CHUNK" -D prev || gh run download "$PR" -R "$REPO" -n "$PW-$B" -D prev
            ls prev | head
          fi
      - name: Work
        env:
          TUNE: ${{ inputs.tune }}
          CHUNK: ${{ matrix.chunk }}
        run: CUBE_SHARD=$(echo "$CHUNK" | sed -n 's/.*k\([0-9]*\)of\([0-9]*\)$/\1\/\2/p') EXT_TIMEOUT=${TUNE%%,*} PYSAT_CAP=${TUNE##*,} CUBE_DEPTH=${{ inputs.cube_depth }} GRUN=${{ inputs.grun }} FORMULAS_FILE=${{ inputs.formulas }} bash worker.sh ${{ inputs.mode }} chunks/${{ inputs.wave }}/${{ matrix.chunk }}.txt out
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.wave }}-${{ matrix.chunk }}
          path: out/
          retention-days: 30
          compression-level: 0
