name: produce
on:
  workflow_dispatch:
    inputs:
      wave:   {description: 'wave name (chunks/<wave>/*.txt)', required: true}
      mode:   {description: 'grun, ccc or merge (join CUBE_SHARD states, then stitch)', required: true, default: grun}
      chunks: {description: 'JSON list of chunk names, e.g. ["c01","c02"]', required: true}
      formulas: {description: 'formulas file in data/', required: false, default: formulas89_c66.json}
      grun:     {description: 'producer script in code/ (grun90.py = encoder v7, grun90v8.py = encoder v8)', required: false, default: grun90.py}
      par:      {description: 'max concurrent jobs of this run', required: false, default: '20'}
      prev_run: {description: 'ccc chaining: run id whose artifacts <prev_wave>-<chunk> hold the cube state to resume', required: false, default: ''}
      prev_wave: {description: 'ccc chaining: wave name of prev_run (default: this wave)', required: false, default: ''}
      cube_depth: {description: 'ccc: initial cube depth (CUBE_DEPTH)', required: false, default: '4'}
      tune: {description: 'ccc tuning "EXT_TIMEOUT,PYSAT_CAP" in seconds (default 1500,240)', required: false, default: '1500,240'}
      window: {description: 'seconds of work per job (WINDOW of worker.sh; empty = 20400). Short values are for probe runs', required: false, default: ''}
      fan: {description: 'ccc shard chunks: "all" = a job named <chunk>k0of<N> (N <= 4) runs all N shards in parallel on its 4 cores, one artifact per shard; "1" = one shard per job', required: false, default: '1'}
permissions:
  contents: read
  actions: read
jobs:
  work:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.par) }}
      matrix:
        chunk: ${{ fromJSON(inputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          sha256sum -c SHA256SUMS
          chmod +x bin/* worker.sh
          python3 --version
          sudo pip3 install --break-system-packages -q "python-sat==1.9.dev21" numpy networkx
          python3 -I -c "import pysat, numpy, networkx; print(pysat.__version__)"
          nproc; free -g
      - name: Plan shards
        env:
          CHUNK: ${{ matrix.chunk }}
          FAN: ${{ inputs.fan }}
        run: |
          # A0..A3 = the chunk names this job works on (state folders out, out_1, out_2, out_3; one artifact each)
          N=$(echo "$CHUNK" | sed -n 's/.*k[0-9]*of\([0-9]*\)$/\1/p'); B=${CHUNK%%k[0-9]*}
          if [ "$FAN" = all ] && [ -n "$N" ] && [ "$N" -le 4 ]; then
            for j in $(seq 0 $((N - 1))); do echo "A$j=${B}k${j}of${N}" >> $GITHUB_ENV; done
          else echo "A0=$CHUNK" >> $GITHUB_ENV; fi
          df -h / /mnt 2>/dev/null || true
      - name: Restore previous ccc state
        if: ${{ inputs.prev_run != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHUNK: ${{ matrix.chunk }}
          PW: ${{ inputs.prev_wave != '' && inputs.prev_wave || inputs.wave }}
          PR: ${{ inputs.prev_run }}
          MODE: ${{ inputs.mode }}
          REPO: ${{ github.repository }}
        run: |
          B=${CHUNK%%k[0-9]*}
          if [ "$MODE" = merge ]; then
            for a in $(gh api "repos/$REPO/actions/runs/$PR/artifacts?per_page=100" --jq '.artifacts[].name' | grep -E "^$PW-${B}k[0-9]+of[0-9]+$"); do
              gh run download "$PR" -R "$REPO" -n "$a" -D "shards/$a"; done
            ls shards
          else
            for j in 0 1 2 3; do
              eval "C=\${A$j:-}"; [ -z "$C" ] && continue
              gh run download "$PR" -R "$REPO" -n "$PW-$C" -D prev_$j || { [ -d prev_base ] || gh run download "$PR" -R "$REPO" -n "$PW-$B" -D prev_base; ln -s prev_base prev_$j; }
            done
            ls prev_0 | head
          fi
      - name: Work
        env:
          TUNE: ${{ inputs.tune }}
          CHUNK: ${{ matrix.chunk }}
          WINDOW: ${{ inputs.window }}
        run: |
          pids=""
          for j in 0 1 2 3; do
            eval "C=\${A$j:-}"; [ -z "$C" ] && continue
            O=out; [ $j -gt 0 ] && O=out_$j
            ( CUBE_SHARD=$(echo "$C" | sed -n 's/.*k\([0-9]*\)of\([0-9]*\)$/\1\/\2/p') PREV=$PWD/prev_$j EXT_TIMEOUT=${TUNE%%,*} PYSAT_CAP=${TUNE##*,} CUBE_DEPTH=${{ inputs.cube_depth }} GRUN=${{ inputs.grun }} FORMULAS_FILE=${{ inputs.formulas }} bash worker.sh ${{ inputs.mode }} chunks/${{ inputs.wave }}/$C.txt $O ) &
            pids="$pids $!"
          done
          rc=0; for p in $pids; do wait $p || rc=$?; done
          df -h / | tail -1; free -m | sed -n 2p; du -sh out* prev_* 2>/dev/null | tr '\n' ' '; echo
          cat out*/ccc.log 2>/dev/null | tail -12; for f in out*/cube/*.log; do echo "== $f"; tail -n 3 "$f" | cut -c1-300; done
          exit $rc
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.wave }}-${{ env.A0 || matrix.chunk }}
          path: out/
          retention-days: 30
          compression-level: 0
      - name: Upload shard 1
        if: ${{ always() && env.A1 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.wave }}-${{ env.A1 }}
          path: out_1/
          retention-days: 30
          compression-level: 0
      - name: Upload shard 2
        if: ${{ always() && env.A2 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.wave }}-${{ env.A2 }}
          path: out_2/
          retention-days: 30
          compression-level: 0
      - name: Upload shard 3
        if: ${{ always() && env.A3 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.wave }}-${{ env.A3 }}
          path: out_3/
          retention-days: 30
          compression-level: 0
